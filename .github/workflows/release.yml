name: Release

# Push a tag like v1.2.3 to run this. It tests, builds the archives for every platform, attests their
# build provenance and creates a DRAFT release, so a person reviews it before it goes public.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag '$tag' is not a version like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          git fetch origin main --depth=1000
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not on main"; exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - name: Build archives
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/dist.sh

      - name: Package manager manifests
        run: scripts/packaging.sh "${GITHUB_REF_NAME#v}"

      - name: Release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md || echo "See the changelog." > release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release-notes.md)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" \
            dist/*.tar.gz dist/*.zip dist/*.deb dist/SHA256SUMS dist/packaging/*
