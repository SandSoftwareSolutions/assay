name: Release

# Runs when a tag such as v1.2.3 is pushed. It builds the archives and creates a DRAFT release,
# so a human reviews and publishes it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build archives
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/dist.sh
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
